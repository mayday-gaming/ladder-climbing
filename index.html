/* ================= AUDIO ================= */
const Snd=(()=>{
 let ac=null,master,mg,sg,nbuf,muted=false,song=null,nextT=0,step=0;

 };

 function init(){

 }
 function osc(type,f,t,d,v,dest,f2,bl){if(!f)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;
  if(bl){o.frequency.setValueAtTime(f*.93,t);o.frequency.exponentialRampToValueAtTime(f,t+.03);}else o.frequency.setValueAtTime(f,t);

 function tick(){

   const sd=60/song.bpm/2,tr=song.tr||0,t=nextT;
   const l=song.L[step%song.L.length];
   if(l){const f=nf(l.n,tr),d=song.pluck?Math.max(.16,l.len*sd*.9):l.len*sd*(l.len>1?.9:.72);

  const bb={x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2};
  for(const s of LV.plats){if(!s.ow&&s.k!='g'&&ov(bb,s)){b.life=0;puff(b.x,b.y,4,C.cyan,1.5,10);break;}}
  if(b.life<=0)continue;
  for(const e of ens){if(e.act&&!e.gone&&ov(bb,e)&&b.hit.indexOf(e)<0){dmgEnemy(e,b.dmg);if(b.pierce)b.hit.push(e);else{b.life=0;break;}}}
  if(b.life>0&&boss&&bossOn&&!boss.dead&&state=='play'&&ov(bb,boss)&&b.hit.indexOf(boss)<0){if(dmgBoss(b.dmg)){puff(b.x,b.y,5,[C.cyan,C.white],2,12);b.life=0;}}
  if(b.x<cam.x-20||b.x>cam.x+W+20)b.life=0;
 }
 bul=bul.filter(b=>b.life>0);

 }
}
