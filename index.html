function moveBody(e){
 e.x+=e.vx;
 for(const s of LV.plats){if(s.ow||!ov(e,s))continue;if(e.vx>0)e.x=s.x-e.w;else if(e.vx<0)e.x=s.x+s.w;e.vx=0;}
 const py=e.y;e.y+=e.vy;e.onGround=false;
 for(const s of LV.plats){if(!ov(e,s))continue;
  if(s.ow){if(e.vy>0&&py+e.h<=s.y+.01){e.y=s.y-e.h;e.vy=0;e.onGround=true;e.gs=s;}}
  else if(e.vy>0){e.y=s.y-e.h;e.vy=0;e.onGround=true;e.gs=s;}
  else if(e.vy<0){e.y=s.y+s.h;e.vy=0;}}
}
