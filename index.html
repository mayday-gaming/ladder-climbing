#touch>*{pointer-events:auto;position:absolute;touch-action:none}
.glassbtn{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .08s ease,filter .08s ease}
#pad{left:14px;bottom:18px;width:168px;height:88px;border-radius:44px;background:linear-gradient(180deg,rgba(40,80,200,.45),rgba(14,30,90,.55));border:1.5px solid rgba(255,255,255,.25);display:flex;color:#ffe066;font-size:28px;box-sizing:border-box}
#pad span{flex:1;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:background .08s}
#pad span.on{background:rgba(255,224,102,.25)}
#pad span:first-child{border-radius:44px 0 0 44px;border-right:1px solid rgba(255,255,255,.15)}
#pad span:last-child{border-radius:0 44px 44px 0}
.btn{border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:12px;line-height:1.05;box-sizing:border-box;letter-spacing:.3px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.btn.on{filter:brightness(1.35);transform:scale(.92)}
#bA{right:14px;bottom:18px;width:86px;height:86px;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffd000 55%,#d79f00);border:1.5px solid rgba(255,255,255,.7);color:#0f1a48;text-shadow:none}
#bB{right:108px;bottom:44px;width:78px;height:78px;background:radial-gradient(circle at 35% 30%,#c8fbff,#3fd6ff 55%,#1b7fd0);border:1.5px solid rgba(255,255,255,.7);color:#04204a;text-shadow:none}
#bS{right:36px;bottom:112px;width:58px;height:58px;background:linear-gradient(180deg,rgba(60,100,230,.6),rgba(20,40,120,.7));border:1.5px solid rgba(255,255,255,.3);color:#dfe7ff;font-size:10px;opacity:.6}
#bS.full{opacity:1;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffb000);color:#3a1a00;border-color:#fff;animation:pu .5s infinite alternate}
#bT{right:104px;bottom:128px;width:52px;height:52px;background:linear-gradient(180deg,rgba(40,200,180,.45),rgba(10,100,90,.6));border:1.5px solid rgba(255,255,255,.3);color:#e0fff9;font-size:9px;opacity:.5}
#bT.ok{opacity:1;background:radial-gradient(circle at 35% 30%,#b8fff2,#18b8a8)}
#bW{display:none;left:200px;bottom:30px;width:56px;height:56px;background:linear-gradient(180deg,rgba(255,224,102,.5),rgba(200,150,0,.55));border:1.5px solid rgba(255,255,255,.4);color:#fff;font-size:10px}
body.touch.aureola #bW{display:flex}
#bN{right:196px;bottom:30px;width:62px;height:62px;background:radial-gradient(circle at 35% 30%,#ffb8c0,#ff3b4a 60%,#b0102a);border:1.5px solid rgba(255,255,255,.6);color:#fff;font-size:10px}
@keyframes pu{to{box-shadow:0 0 22px 8px rgba(255,220,90,.75)}}
#sys{position:fixed;right:8px;bottom:6px;display:flex;gap:8px;opacity:.7}
body.touch #sys{right:auto;left:50%;transform:translateX(-50%)}
@media (orientation:landscape){body.touch #pad{left:6px;bottom:8px;width:150px;height:80px;opacity:.85}body.touch #bA{right:6px;bottom:8px;width:78px;height:78px;opacity:.85}body.touch #bB{right:90px;bottom:18px;width:70px;height:70px;opacity:.85}body.touch #bS{right:18px;bottom:94px;width:52px;height:52px}body.touch #bT{right:80px;bottom:100px;width:46px;height:46px}body.touch #bN{right:166px;bottom:22px;width:54px;height:54px;opacity:.85}body.touch #bW{left:164px;bottom:14px;width:50px;height:50px}}
#sys button{width:36px;height:30px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(180deg,rgba(40,70,180,.7),rgba(10,24,80,.8));color:#ffe066;font:700 14px Fredoka,system-ui,sans-serif;padding:0;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
body.touch #touch{display:block}
@media (orientation:portrait){
 #wrap{align-items:flex-start}
 body.touch #tip{display:block}
 #pad{bottom:max(40px,16vh)} #bA{bottom:max(40px,16vh)} #bB{bottom:calc(max(40px,16vh) + 26px)} #bS{bottom:calc(max(40px,16vh) + 96px)} #bT{bottom:calc(max(40px,16vh) + 112px)} #bN{left:30px;right:auto;bottom:calc(max(40px,16vh) + 108px)} #bW{left:104px;bottom:calc(max(40px,16vh) + 112px)}
 #sys{bottom:max(10px,4vh)}
}
